<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Андерграундный Ленинград</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg:#0a0a0a; --sep:#1e1e1e; --sep2:#222;
  --text:#e8e8e8; --text2:#999; --text3:#555;
  --accent:#c8ff6e; --orange:#ff8c42; --teal:#5dcaa5;
  --tab-h:56px; --player-h:64px; --max-w:390px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#050505;min-height:100vh;font-family:'Golos Text',sans-serif;font-size:16px;color:var(--text);overscroll-behavior:none}
#app{max-width:var(--max-w);margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}

/* progress */
#progress-bar{height:2px;background:var(--sep);flex-shrink:0;position:relative}
#progress-fill{height:100%;background:var(--accent);width:0%;transition:width .5s ease}
#progress-label{position:absolute;right:12px;top:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.5px}

/* header */
.page-header{padding:20px 16px 0;flex-shrink:0}
.page-header h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1.5px;line-height:1}
.page-header p{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:5px}

/* listen all */
.listen-all-wrap{padding:14px 16px 12px;flex-shrink:0}
.listen-all-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(200,255,110,.09);border:.5px solid rgba(200,255,110,.28);border-radius:12px;padding:14px 16px;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:background .18s}
.listen-all-btn:active{background:rgba(200,255,110,.16)}
.listen-all-btn svg{width:16px;height:16px;flex-shrink:0}

/* scroll */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tab-h) + var(--player-h) + 20px)}
.tab-panel{display:none;animation:fadeIn .2s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* point card */
.point-card{border-bottom:.5px solid var(--sep)}
.point-header{display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer;transition:background .12s}
.point-header:active{background:#0d0d0d}
.point-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);min-width:18px;flex-shrink:0}
.point-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.type-bar    .point-icon{background:rgba(200,255,110,.12);color:var(--accent)}
.type-gone   .point-icon{background:rgba(150,150,150,.12);color:#888}
.type-museum .point-icon{background:rgba(93,202,165,.12);color:var(--teal)}
.type-yard   .point-icon{background:rgba(150,150,150,.12);color:#999}
.type-boiler .point-icon{background:rgba(255,140,66,.12);color:var(--orange)}
.point-meta{flex:1;min-width:0}
.point-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.point-addr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-top:2px}
.dist-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);margin-top:3px}
.point-play-btn{background:none;border:none;cursor:pointer;color:#555;padding:6px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;transition:color .15s,background .15s}
.point-play-btn svg{width:22px;height:22px}
.point-play-btn:active,.point-play-btn.playing{color:var(--accent)}

/* body */
.point-body{display:none}
.point-card.expanded .point-body{display:block}
.point-photo{width:100%;height:200px;object-fit:cover;display:block;filter:grayscale(20%) brightness(.85)}
.point-photo-err{width:100%;height:0;display:none}
.point-photo-cap{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);padding:6px 16px 0;letter-spacing:.3px}
.point-text{font-size:15px;color:#bbb;line-height:1.75;white-space:pre-wrap;padding:14px 16px 16px}
.soon-badge{margin:0 16px 16px;padding:12px;background:rgba(255,140,66,.06);border:.5px solid rgba(255,140,66,.25);border-radius:8px;font-size:14px;color:var(--orange);line-height:1.5}
.soon-badge strong{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.7}

/* transit card */
.transit-card{border-bottom:.5px solid var(--sep)}
.transit-header{display:flex;gap:10px;align-items:center;padding:12px 16px;cursor:pointer;transition:background .12s;padding-left:calc(16px + 18px + 10px)}
.transit-header:active{background:#0d0d0d}
.transit-meta{flex:1;min-width:0}
.transit-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.transit-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.3px}
.transit-play-btn{background:none;border:none;cursor:pointer;color:#444;padding:6px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;transition:color .15s}
.transit-play-btn svg{width:20px;height:20px}
.transit-play-btn:active,.transit-play-btn.playing{color:var(--accent)}
.transit-body{display:none;padding:0 16px 16px calc(16px + 18px + 10px)}
.transit-card.expanded .transit-body{display:block}
.transit-text{font-size:15px;color:#aaa;line-height:1.7}
/* ambient player canvas */
.ambient-wrap{margin-top:12px;display:flex;align-items:center;gap:10px}
.ambient-btn{background:none;border:.5px solid #333;border-radius:20px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#555;cursor:pointer;letter-spacing:.5px;white-space:nowrap;transition:border-color .2s,color .2s}
.ambient-btn:hover,.ambient-btn.playing{border-color:var(--accent);color:var(--accent)}
.ambient-canvas{flex:1;height:24px;opacity:.4}

/* map */
#map-wrap{position:relative}
#map{width:100%;height:calc(100vh - 112px);background:#0a0a0a}
#map-skeleton{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);z-index:1;transition:opacity .3s;pointer-events:none}
#map-skeleton.hidden{opacity:0}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:#111!important;color:#888!important;border-color:#222!important}
.leaflet-bar{border:.5px solid #222!important;box-shadow:none!important}
.leaflet-popup-content-wrapper{background:#111!important;border:.5px solid #2a2a2a!important;border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.7)!important;color:var(--text)!important;font-family:'Golos Text',sans-serif!important}
.leaflet-popup-tip{background:#111!important}
.leaflet-popup-content{margin:12px 14px!important}
.popup-name{font-weight:600;font-size:15px}
.popup-addr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-top:3px}
.popup-goto{display:inline-block;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);cursor:pointer;text-transform:uppercase;letter-spacing:.4px}

/* people */
.people-list{padding:4px 0 0}
.section-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:1.4px;text-transform:uppercase;padding:16px 16px 8px}
.person-card{border-bottom:.5px solid var(--sep);cursor:pointer}
.person-header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px}
.person-name{font-size:15px;font-weight:600;color:var(--text)}
.person-dates{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-top:1px}
.person-chev{color:#444;font-size:11px;transition:transform .2s;flex-shrink:0}
.person-card.expanded .person-chev{transform:rotate(180deg)}
.person-body{display:none;padding:0 16px 15px}
.person-card.expanded .person-body{display:block}
.person-bio{font-size:14px;color:#999;line-height:1.7}
.person-where{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal)}

/* player */
#player-bar{position:fixed;bottom:var(--tab-h);left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--player-h);background:#0d0d0d;border-top:.5px solid #1e1e1e;display:none;align-items:center;padding:0 14px;gap:10px;z-index:30}
#player-bar.visible{display:flex}
.pb-track{flex:1;min-width:0}
#pb-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pb-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pb-sub.warn{color:var(--orange)}
.pb-btn{background:none;border:none;cursor:pointer;color:#888;padding:6px;display:flex;align-items:center;border-radius:50%;transition:color .15s;flex-shrink:0}
.pb-btn:active{color:var(--text)}
.pb-btn svg{width:24px;height:24px}
.pb-btn.sm svg{width:18px;height:18px}

/* nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--tab-h);background:#0d0d0d;border-top:.5px solid #1a1a1a;display:flex;align-items:center;z-index:40}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;cursor:pointer;color:#444;padding:8px 4px;transition:color .18s}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.7px;text-transform:uppercase}
.nav-btn.active{color:var(--accent)}

/* fade */
.fade-up{opacity:0;transform:translateY(10px);transition:opacity .38s ease,transform .38s ease}
.fade-up.visible{opacity:1;transform:none}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="progress-bar">
    <div id="progress-fill"></div>
    <div id="progress-label">0 / 15</div>
  </div>
  <div class="page-header">
    <h1>Андерграундный<br>Ленинград</h1>
    <p>15 точек · 4 рюмочных · ~8 км · 4–5 часов</p>
  </div>
  <div class="listen-all-wrap">
    <button class="listen-all-btn" id="btn-listen-all" onclick="listenAll()">
      <svg viewBox="0 0 24 24" fill="currentColor" id="la-play-icon"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" id="la-pause-icon" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      <span id="la-label">Слушать весь маршрут</span>
    </button>
  </div>
  <div class="scroll-area">
    <div class="tab-panel active" id="tab-route"><div id="route-list"></div></div>
    <div class="tab-panel" id="tab-map">
      <div id="map-wrap">
        <div id="map-skeleton">Загружаем карту…</div>
        <div id="map"></div>
      </div>
    </div>
    <div class="tab-panel" id="tab-people"><div class="people-list" id="people-list"></div></div>
  </div>
</div>

<div id="player-bar">
  <button class="pb-btn" onclick="playerToggle()">
    <svg id="pb-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pb-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </button>
  <div class="pb-track">
    <div id="pb-name">—</div>
    <div id="pb-sub"></div>
  </div>
  <button class="pb-btn sm" onclick="playerNext()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
  </button>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="route">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span>Маршрут</span>
  </button>
  <button class="nav-btn" data-nav="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
    <span>Карта</span>
  </button>
  <button class="nav-btn" data-nav="people">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Люди</span>
  </button>
</nav>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const POINTS = [
  { id:1, name:'«Сайгон»', addr:'Невский пр., 49', type:'gone', icon:'◌',
    lat:59.9298, lng:30.3509, audio:'1.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Nevsky_49_SPB.jpg/800px-Nevsky_49_SPB.jpg',
    photoCap:'Невский пр., 49. Угол с Владимирским',
    text:`Угол Невского и Владимирского. Сейчас здесь ничего особенного — ну угол и угол — но с конца шестидесятых по 1989 год вот здесь стояло, пожалуй, самое важное заведение города.

Кафе «Москва». Все называли его Сайгоном. Про название есть одна история. Когда в зале запрещали курить, люди выходили на угол. Однажды две девушки закурили прямо у входа, подошёл милиционер: «Что вы тут устроили? Какой-то Сайгон». У столицы Южного Вьетнама была в СССР репутация места полного хаоса — вот и прилипло.

Кофейная карта: «Маленький простой» — четырнадцать копеек, «Маленький двойной» — двадцать восемь, именно он стал главным напитком заведения. «Большой двойной» со сгущёнкой — двадцать две копейки, «Большой четверной» — пятьдесят две. Очередь была всегда.

Внутри был маленький угловой зал, меньше средней квартиры. Сидячих мест почти не было — люди приходили, выпивали стакан, говорили с кем надо и уходили. Именно из-за этой текучки здесь за одно утро можно было столкнуться с Бродским, договориться о продаже картины иностранному дипломату и узнать о квартирнике на вечер.

КГБ за Сайгоном следило, и все об этом знали. Но это никого не останавливало — ощущение слежки давно стало частью городского воздуха. В 1989-м здание снесли.` },

  { id:2, name:'Рюмочная на Пушкинской', addr:'Пушкинская ул., 1', type:'bar', icon:'♦',
    lat:59.9285, lng:30.3565, audio:'2.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Pushkinskaya_street_SPB.jpg/800px-Pushkinskaya_street_SPB.jpg',
    photoCap:'Пушкинская улица',
    text:`Добро пожаловать в жанр. Вот она — рюмочная на Пушкинской.

Водка здесь стоила шестьдесят две копейки за сто грамм. Меню писали мелом на доске, женщины за стойкой работали десятилетиями и знали постоянных в лицо. Никакого пива — только водка и кофе.

Рихард Васми в пятидесятые ходил на Сенной рынок рисовать с натуры. Грузчиков, пьяниц, людей с тяжёлыми обветренными руками. Не потому что это был манифест — просто они ему были интересны, живые, нефильтрованные. И рюмочная была продолжением той же логики.

Шварц, Арефьев, Шагин — все крутились в этом районе. Здесь не нужно было объяснять кто ты. Пришёл, выпил, послушал разговоры за соседним столиком, ушёл.

По одной за эпоху — и идём дальше.` },

  { id:3, name:'Дом Довлатова', addr:'ул. Рубинштейна, 23', type:'museum', icon:'▭',
    lat:59.9265, lng:30.3489, audio:'3.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Rubinshteyna_23_SPb.jpg/800px-Rubinshteyna_23_SPb.jpg',
    photoCap:'ул. Рубинштейна, 23',
    text:`Дом двадцать три, шестой этаж. Коммунальная квартира — шесть комнат, общий коридор, соседи через стенку. Довлатов прожил здесь почти двадцать лет, с конца пятидесятых до эмиграции в 1979-м. Из всего что здесь было, сохранилась только зелёная изразцовая печь в его комнате.

Днём он писал репортажи для «Советского спорта» — это давало прописку и деньги. По ночам писал прозу, которую некуда было отнести. Несколько раз пробовал опубликоваться официально — каждый раз редактор возвращал рукопись. Не за политику — просто писал про реальных людей слишком узнаваемо.

Рукописи расходились в самиздате — перепечатанные на машинке, зачитанные до дыр.

В Ленинград он больше не вернулся. Умер в Нью-Йорке в 1990-м — через год после того как здесь наконец стало можно публиковать всё что угодно. Немного не успел.

Зайди во двор — типичный петербургский колодец, тёмный, узкий, небо сверху узкой полосой.` },

  { id:4, name:'Ленинградский Рок-клуб', addr:'ул. Рубинштейна, 13', type:'yard', icon:'·',
    lat:59.9271, lng:30.3483, audio:'4.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Viktor_Tsoy_1988.jpg/600px-Viktor_Tsoy_1988.jpg',
    photoCap:'Виктор Цой, 1988',
    text:`Буквально двести метров от Довлатова — и мы у обычной парадной в обычном доме. Никакой вывески. А с 1981 года здесь работал Ленинградский рок-клуб — первая в СССР легальная площадка для неофициальной музыки.

КГБ дало разрешение, искренне рассчитывая что контролируемый клуб лучше неконтролируемых квартирников. Вышло ровно наоборот. Здесь играли «Кино», «Аквариум», «Зоопарк», «Алиса». Билеты расходились за несколько часов.

Тимур Новиков рисовал афиши вручную. Гурьянов играл на барабанах в «Кино» и был художником «Новых художников» — и никогда не видел в этом никакого противоречия.

Рубинштейна, 13 и Рубинштейна, 23 — двести метров. Довлатов и Цой были буквально соседями.` },

  { id:5, name:'Двор Капеллы', addr:'Наб. Мойки, 20', type:'yard', icon:'·',
    lat:59.9397, lng:30.3195, audio:'5.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Capella_yard_SPB.jpg/800px-Capella_yard_SPB.jpg',
    photoCap:'Двор Капеллы, наб. Мойки',
    text:`Мойка, двадцать. Заходим через ворота. Вот этот двор был в каждом неофициальном путеводителе города — если бы такие путеводители существовали вообще.

В советском городе с его дворниками-осведомителями — найти место где можно раствориться было задачей нетривиальной. А здесь — зашёл с Невского, прошёл насквозь, вышел на набережную. Никто не спрашивает зачем ты здесь.

Фарцовщики знали такие дворы наизусть. Люди которым нужно было передать рукопись — тоже. Не романтика, просто практическая городская география.

Пройди насквозь — обрати внимание как меняется звук. Невский за спиной, Мойка впереди, тридцать секунд тишины между ними.` },

  { id:6, name:'Музей Ахматовой', addr:'Литейный пр., 53', type:'museum', icon:'▭',
    lat:59.9404, lng:30.3594, audio:'6.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Anna_Akhmatova_1922.jpg/600px-Anna_Akhmatova_1922.jpg',
    photoCap:'Анна Ахматова, 1922',
    text:`Вот он — Фонтанный дом. Вход со двора, не с улицы — ищи арку. Ахматова прожила здесь с 1926-го по 1952-й. Двадцать шесть лет. И за эти годы через неё прошло буквально всё что случилось со страной.

Арест сына Льва — дважды. Постановление ЦК 1946 года, где Жданов назвал её «блудницей и монахиней» и запретил публиковать.

«Реквием» писался в уме и на клочках бумаги которые сразу сжигались. Несколько близких людей заучивали строфы наизусть. Ходили к ней, читали, запоминали, уходили. Живая память вместо архива. Опубликовали только в 1987-м — через двадцать один год после её смерти.

Молодой Бродский пришёл к ней в начале шестидесятых — ему было двадцать с небольшим, никаких публикаций. Она приняла его всерьёз.` },

  { id:7, name:'KGallery', addr:'Наб. Фонтанки, 24', type:'museum', icon:'▭',
    lat:59.9363, lng:30.3482, audio:'7.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Timur_Novikov_1990s.jpg/600px-Timur_Novikov_1990s.jpg',
    photoCap:'Тимур Новиков, 1990-е',
    text:`Выходим на Фонтанку. Где-то на этой набережной — точный адрес так и не зафиксирован — в восьмидесятые находилась квартира Тимура Новикова. Галерея «АССА» — расселённая коммуналка, которую он превратил в выставочное место и точку притяжения.

Сюда приходил Цой — они с Новиковым вместе делали обложки и афиши. Алексей Учитель снимал здесь часть «АССЫ» в 1987-м — и название фильма взял прямо отсюда.

Новиков рисовал на мешковине, обоях, кусках найденной ткани. Сделал — показал — пошёл дальше.

KGallery сегодня одна из лучших частных галерей города с коллекцией именно этого периода.` },

  { id:8, name:'Рюмочная «Маяк»', addr:'ул. Маяковского, 20', type:'bar', icon:'♦',
    lat:59.9342, lng:30.3602, audio:'8.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Mayak_bar_SPb.jpg/800px-Mayak_bar_SPb.jpg',
    photoCap:'Рюмочная «Маяк»',
    text:`Маяковского, двадцать — вот она, «Маяк». Заходим.

На стене — Ленин. Не в смысле иронии — просто висит портрет как висел всегда, и никто его не снял потому что незачем. Здесь никто не воссоздавал советскую атмосферу — она просто не успела исчезнуть.

Арефьев в пятидесятые ходил в портовые кварталы, в такие вот забегаловки — и рисовал людей которых никто не собирался рисовать. Советская живопись была занята сталеварами с правильными лицами, а Арефьев рисовал тех кого видел за стойкой рядом.

Борщ здесь до сих пор дешевле чем в любом кафе на соседнем Невском. Выпей что-нибудь и посмотри на Ленина. Это не грубость, это жанр.` },

  { id:9, name:'Арт-центр Пушкинская 10', addr:'Лиговский пр., 53', type:'museum', icon:'▭',
    lat:59.9258, lng:30.3603, audio:'9.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Pushkinskaya_10_entrance.jpg/800px-Pushkinskaya_10_entrance.jpg',
    photoCap:'Арт-центр «Пушкинская-10»',
    text:`Лиговский, пятьдесят три. Ищи арку — вход не с улицы, со двора. Немного спрятано, немного надо знать куда идти. Это не случайно.

В 1989 году несколько художников просто зашли в пустующий жилой дом и начали там работать. По советским меркам абсолютно незаконный захват жилплощади. По меркам 1989 года — государству было уже не до этого.

Потом было несколько лет судов с застройщиками. Отстояли. Сейчас здесь Музей нонконформистского искусства и несколько десятков мастерских, где художники работают прямо сейчас.

Коллекция собиралась не через закупки, а через личные связи, через доверие. Это чувствуется когда ходишь по залам.` },

  { id:'9b', name:'Рюмочная «Достоевская»', addr:'Разъезжая ул., 2', type:'bar', icon:'♦',
    lat:59.9241, lng:30.3512, audio:null,
    text:`Разъезжая, два — вот она. Два шага от Пушкинской-10, ближайший к маршруту аутентичный распивочный адрес.

Советская рюмочная с атмосферой 1980–1990-х — без реконструкции, без концепции, просто так и осталась. Интерьер который никто специально не создавал.

Этот район — Достоевская, Владимирская — был плотно заселён людьми из тех кругов. Здесь снимали коммуналки, здесь ходили пешком между Сайгоном и рок-клубом и обратно.

Выпей, отдышись. До Фурштатской ещё идти.` },

  { id:10, name:'Квартира Михнова-Войтенко', addr:'Фурштатская ул., 14–16', type:'yard', icon:'·',
    lat:59.9441, lng:30.3647, audio:'10.mp3',
    text:`Вот этот двор. Никакой таблички нет и никогда не было. Обычный петербургский колодец. Но именно в коммунальной квартире этого дома с конца пятидесятых по 1988 год жил и работал Евгений Михнов-Войтенко — один из самых важных художников ленинградского андерграунда, про которого при жизни почти никто не знал.

Официально он был декоратором в театре — это давало прописку. В остальное время — абстракция. Михнов изобрёл собственную технику: подвижный стол, краска растекается сама — непредсказуемо, против воли художника. Некоторые работы так и не развернул ни разу.

Он не устраивал квартирных выставок, не толкался в Сайгоне. Просто писал — для себя, в тишине.

Умер в 1988-м. Через год его начали открывать. Сейчас его работы уходят на аукционах за сотни тысяч долларов.

Посмотри на окна. Вот так и выглядит история про которую никто не знал пока она происходила.` },

  { id:11, name:'Академия художеств', addr:'Университетская наб., 17', type:'yard', icon:'·',
    lat:59.9381, lng:30.2916, audio:'11.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/SPB_Academy_of_Arts.jpg/800px-SPB_Academy_of_Arts.jpg',
    photoCap:'Академия художеств, Университетская наб.',

    text:`Васильевский остров. Академия художеств, основана в 1757-м. И вот здесь, в художественной школе при Академии, в конце сороковых учились несколько человек которые потом стали первым ленинградским андерграундом.

Арефьев, Васми, Шагин, Шварц, Гудзенко. Они познакомились здесь, и здесь же поняли что официальное советское искусство им совершенно неинтересно.

Они называли себя «Орден нищенствующих живописцев». ОНЖ. Работали в стол, денег не было, выставок не было, признания не было. Просто рисовали — потому что не могли не рисовать.

Шемякин тоже учился здесь — и был исключён. Устроился такелажником в Эрмитаж — вот туда, в пяти минутах по набережной.` },

  { id:12, name:'Государственный Эрмитаж', addr:'Дворцовая пл., 2', type:'museum', icon:'▭',
    lat:59.9399, lng:30.3146, audio:'12.mp3',
    photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Hermitage_Museum_SPB.jpg/800px-Hermitage_Museum_SPB.jpg',
    photoCap:'Государственный Эрмитаж',
    text:`Эрмитаж. Три миллиона экспонатов. Но сейчас нас интересует не это.

Шемякин работал здесь такелажником — физически перемещал произведения и получил доступ к запасникам. Представь: ты двадцатилетний художник в закрытой стране. И вдруг — Рубенс, Рембрандт, Матисс вживую, каждый день.

Зайди в залы с фламандцами — именно там Шемякин проводил часы. Плотная фактура, тьма и свет, мистика бытовых предметов.

Встань в зале с Рембрандтом и подумай — вот что видел человек который потом ночью рисовал абстракцию в своей коммуналке на Фурштатской.` },

  { id:13, name:'Котельная «Камчатка»', addr:'ул. Блохина, 15', type:'boiler', icon:'▲',
    lat:59.9531, lng:30.2993, audio:'13.mp3',

    photoCap:'Котельная «Камчатка», ул. Блохина, 15',
    soon:{title:'Петроградская сторона', text:'Котельные, митьки, каналы которые рисовал Васми — отдельный маршрут. Скоро.'},
    text:`Петроградская сторона, улица Блохина. Вот этот подвал. Маленькая котельная, сейчас музей — но физически всё подлинное: топка, уголь, инструменты, топчан у стены.

Цой работал здесь кочегаром. Каспарян тоже. Смена длилась сутки, потом двое суток свободных. За смену нужно было поддерживать огонь — и всё. Это давало официальное место работы, прописку и огромное количество свободного времени.

Без официального места работы — статья 209, тунеядство. По ней в 1964-м судили Бродского и отправили на пять лет в Архангельскую область.

Встань у топки. Ты затопил, поставил чайник, достал тетрадь. Следующие двадцать часов — твои.` },

  { id:14, name:'Синичка / «На ход ноги»', addr:'Каменноостровский пр., 14', type:'bar', icon:'♦',
    lat:59.9628, lng:30.3145, audio:'14.mp3',
    text:`Вот мы и добрались. Петроградская сторона — это территория арефьевского круга и митьков. Именно здесь они снимали коммуналки, работали в котельных, ходили друг к другу в гости.

«Синичка» на Каменноостровском — домашняя кухня, настойки, уютная теснота. «На ход ноги» на Красносельской — круглосуточная, супы, окрошка, народное место без претензий.

Орден нищенствующих живописцев пил в таких местах. Арефьев, Васми, Шагин, Шварц — большинство из них при жизни не знал почти никто. Работы лежали в рулонах по коммуналкам. Просто рисовали, потому что не могли не рисовать.

Последняя рюмка — за них.` }

// ── HELPERS ───────────────────────────────────────────────────────────────────
function typeIcon(t){return{bar:'♦',gone:'◌',museum:'▭',yard:'·',boiler:'▲'}[t]||'·'}
const visited=new Set(JSON.parse(localStorage.getItem('visited')||'[]'));
function saveVisited(){localStorage.setItem('visited',JSON.stringify([...visited]));updateProgress()}
function updateProgress(){
  const pct=Math.round(visited.size/POINTS.length*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=visited.size+' / '+POINTS.length;
}

// ── BUILD ROUTE ───────────────────────────────────────────────────────────────
function buildRoute(){
  const list=document.getElementById('route-list');
  const trMap={};
  TRANSITIONS.forEach(t=>trMap[String(t.after)]=t);

  POINTS.forEach((pt,idx)=>{
    // Point card
    const card=document.createElement('div');
    card.className=`point-card type-${pt.type} fade-up`;
    card.id=`point-${pt.id}`;

    const photoHtml=pt.photo?`<img class="point-photo" src="${pt.photo}" loading="lazy" onerror="this.style.display='none'" alt=""><div class="point-photo-cap">${pt.photoCap||''}</div>`:'';
    const playHtml=pt.audio?`<button class="point-play-btn" data-id="${pt.id}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>`:'';
    const soonHtml=pt.soon?`<div class="soon-badge"><strong>Следующий маршрут</strong>${pt.soon.title} — ${pt.soon.text}</div>`:'';

    card.innerHTML=`
      <div class="point-header">
        <span class="point-num">${String(idx+1).padStart(2,'0')}</span>
        <div class="point-icon">${typeIcon(pt.type)}</div>
        <div class="point-meta">
          <div class="point-name">${pt.name}</div>
          <div class="point-addr">${pt.addr}</div>
        </div>
        ${playHtml}
      </div>
      <div class="point-body">
        ${photoHtml}
        <div class="point-text">${pt.text}</div>
        ${soonHtml}
      </div>`;

    card.querySelector('.point-header').addEventListener('click',e=>{
      if(e.target.closest('.point-play-btn'))return;
      card.classList.toggle('expanded');
    });
    const pb=card.querySelector('.point-play-btn');
    if(pb)pb.addEventListener('click',e=>{e.stopPropagation();playItem('point',pt.id);});
    list.appendChild(card);

    // Transition card
    const tr=trMap[String(pt.id)];
    if(tr){
      const tcard=document.createElement('div');
      tcard.className='transit-card fade-up';
      tcard.id=`transit-${pt.id}`;
      const tplayHtml=tr.audio?`<button class="transit-play-btn" data-audio="${tr.audio}" data-title="${tr.title}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>`:'';
      tcard.innerHTML=`
        <div class="transit-header">
          <div class="transit-meta">
            <div class="transit-name">${tr.title}</div>
            <div class="transit-sub">${tr.sub}</div>
          </div>
          ${tplayHtml}
        </div>
        <div class="transit-body">
          <div class="transit-text">${tr.text}</div>
          <div class="ambient-wrap">
            <button class="ambient-btn" data-tr="${pt.id}">♩ Атмосфера</button>
            <canvas class="ambient-canvas" data-tr="${pt.id}" width="200" height="24"></canvas>
          </div>
        </div>`;
      tcard.querySelector('.transit-header').addEventListener('click',e=>{
        if(e.target.closest('.transit-play-btn'))return;
        tcard.classList.toggle('expanded');
      });
      const tpb=tcard.querySelector('.transit-play-btn');
      if(tpb)tpb.addEventListener('click',e=>{e.stopPropagation();playItem('transit',null,tr.audio,tr.title);});
      const ambBtn=tcard.querySelector('.ambient-btn');
      ambBtn.addEventListener('click',()=>toggleAmbient(ambBtn,tcard.querySelector('.ambient-canvas')));
      list.appendChild(tcard);
    }
  });
  updateProgress();
}

// ── PEOPLE ────────────────────────────────────────────────────────────────────
function buildPeople(){
  const list=document.getElementById('people-list');
  PEOPLE.forEach(sec=>{
    const t=document.createElement('div');t.className='section-title';t.textContent=sec.section;list.appendChild(t);
    sec.items.forEach(p=>{
      const card=document.createElement('div');card.className='person-card fade-up';
      card.innerHTML=`<div class="person-header"><div><div class="person-name">${p.name}</div><div class="person-dates">${p.dates}</div></div><span class="person-chev">▾</span></div><div class="person-body"><div class="person-bio">${p.bio}</div>${p.where?`<div class="person-where">↗ ${p.where}</div>`:''}</div>`;
      card.querySelector('.person-header').addEventListener('click',()=>card.classList.toggle('expanded'));
      list.appendChild(card);
    });
  });
}

// ── MAP ───────────────────────────────────────────────────────────────────────
let mapInited=false,leafletMap,userMarker,geoWatchId=null,osrmLayer=null,fallbackLayer=null;

function initMap(){
  if(mapInited)return;
  mapInited=true;
  leafletMap=L.map('map',{zoomControl:true,attributionControl:false}).setView([59.937,30.32],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(leafletMap);
  setTimeout(()=>document.getElementById('map-skeleton').classList.add('hidden'),800);

  const colors={bar:'#c8ff6e',gone:'#999',museum:'#5dcaa5',yard:'#ccc',boiler:'#ff8c42'};
  POINTS.forEach((pt,idx)=>{
    const c=colors[pt.type]||'#aaa';
    const icon=L.divIcon({
      className:'',
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;font-family:'IBM Plex Mono',monospace;box-shadow:0 0 0 2px rgba(0,0,0,.5);">${idx+1}</div>`,
      iconSize:[28,28],iconAnchor:[14,14]
    });
    L.marker([pt.lat,pt.lng],{icon}).addTo(leafletMap)
      .bindPopup(`<div class="popup-name">${pt.name}</div><div class="popup-addr">${pt.addr}</div><div class="popup-goto" onclick="goToPoint('${pt.id}')">К тексту →</div>`);
  });

  drawRoute();
  startGPS();
}

function drawRoute(){
  if(!leafletMap)return;
  const coords=POINTS.map(p=>[p.lat,p.lng]);
  if(fallbackLayer)leafletMap.removeLayer(fallbackLayer);
  fallbackLayer=L.polyline(coords,{color:'#c8ff6e',weight:1.5,opacity:0.35,dashArray:'4 7'}).addTo(leafletMap);

  const coordStr=POINTS.map(p=>`${p.lng},${p.lat}`).join(';');
  fetch(`https://router.project-osrm.org/route/v1/foot/${coordStr}?overview=full&geometries=geojson`)
    .then(r=>r.json()).then(d=>{
      if(d.routes?.[0]){
        if(fallbackLayer)leafletMap.removeLayer(fallbackLayer);
        if(osrmLayer)leafletMap.removeLayer(osrmLayer);
        osrmLayer=L.geoJSON(d.routes[0].geometry,{style:{color:'#c8ff6e',weight:2,opacity:0.45}}).addTo(leafletMap);
      }
    }).catch(()=>{});
}

function startGPS(){
  if(!navigator.geolocation)return;
  if(geoWatchId!==null)return;
  geoWatchId=navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    const dotHtml=`<div style="width:14px;height:14px;border-radius:50%;background:#00ff88;border:2.5px solid #000;box-shadow:0 0 10px #00ff8888;"></div>`;
    if(!userMarker){
      userMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:dotHtml,iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:1000}).addTo(leafletMap);
    }else userMarker.setLatLng([lat,lng]);
    updateDistances(lat,lng);
  },err=>{console.warn('GPS:',err.message)},{enableHighAccuracy:true,timeout:15000});
}

function updateDistances(lat,lng){
  POINTS.forEach(pt=>{
    const d=Math.round(haversine(lat,lng,pt.lat,pt.lng));
    const card=document.getElementById(`point-${pt.id}`);
    if(!card)return;
    let el=card.querySelector('.dist-badge');
    if(!el){el=document.createElement('div');el.className='dist-badge';card.querySelector('.point-meta').appendChild(el);}
    el.textContent=d<150?'Вы здесь':d<1000?`${d} м`:`${(d/1000).toFixed(1)} км`;
    if(d<150&&!visited.has(String(pt.id))){visited.add(String(pt.id));saveVisited();card.classList.add('point-visited');}
  });
}

function haversine(a,b,c,d){const R=6371000,dl=(c-a)*Math.PI/180,dl2=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function goToPoint(id){
  switchTab('route');
  setTimeout(()=>{const el=document.getElementById(`point-${id}`);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('expanded');}},120);
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
// playlist is array of {type:'point'|'transit', id, audio, title, addr}
let audio=null,playlist=[],playIdx=0,isPlaying=false,isPlaylistMode=false;

function buildPlaylist(){
  const arr=[];
  const trMap={};
  TRANSITIONS.forEach(t=>trMap[String(t.after)]=t);
  POINTS.forEach(pt=>{
    if(pt.audio)arr.push({type:'point',id:pt.id,audio:pt.audio,title:pt.name,addr:pt.addr});
    const tr=trMap[String(pt.id)];
    if(tr&&tr.audio)arr.push({type:'transit',id:`tr-${pt.id}`,audio:tr.audio,title:tr.title,addr:tr.sub});
  });
  return arr;
}

function playItem(type,id,audioFile,title,addr){
  if(audio){audio.pause();audio.onended=null;}
  let file,name,sub;
  if(type==='point'){
    const pt=POINTS.find(p=>String(p.id)===String(id));
    if(!pt||!pt.audio)return;
    file=pt.audio;name=pt.name;sub=pt.addr;
  }else{
    file=audioFile;name=title;sub=addr||'Переход';
  }
  audio=new Audio(file);
  isPlaying=true;
  document.getElementById('pb-name').textContent=name;
  document.getElementById('pb-sub').textContent=sub||'';
  document.getElementById('pb-sub').className='';
  document.getElementById('player-bar').classList.add('visible');
  setPbIcon(false);
  updateInlineBtns(type,type==='point'?id:audioFile,true);
  audio.play().catch(()=>{document.getElementById('pb-sub').textContent='Файл не найден';document.getElementById('pb-sub').className='warn';});
  audio.onended=()=>{isPlaying=false;setPbIcon(true);updateInlineBtns(type,type==='point'?id:audioFile,false);if(isPlaylistMode)advancePlaylist();};
  audio.onpause=()=>{isPlaying=false;setPbIcon(true);};
  audio.onplay=()=>{isPlaying=true;setPbIcon(false);};
}

function advancePlaylist(){
  playIdx++;
  if(playIdx<playlist.length){
    const item=playlist[playIdx];
    playItem(item.type,item.id,item.audio,item.title,item.addr);
  }else{
    isPlaylistMode=false;updateListenAllBtn(false);
  }
}

function listenAll(){
  if(isPlaylistMode&&isPlaying){audio.pause();isPlaylistMode=false;updateListenAllBtn(false);return;}
  playlist=buildPlaylist();
  playIdx=0;isPlaylistMode=true;
  updateListenAllBtn(true);
  if(playlist.length)playItem(playlist[0].type,playlist[0].id,playlist[0].audio,playlist[0].title,playlist[0].addr);
}

function playerToggle(){if(!audio)return;isPlaying?audio.pause():audio.play();}

function playerNext(){
  if(isPlaylistMode){advancePlaylist();return;}
  // non-playlist: find next point with audio
  if(!audio)return;
  const cur=document.getElementById('pb-name').textContent;
  const pts=POINTS.filter(p=>p.audio);
  const idx=pts.findIndex(p=>p.name===cur);
  if(idx>=0&&idx+1<pts.length)playItem('point',pts[idx+1].id);
}

function setPbIcon(showPlay){
  document.getElementById('pb-play-icon').style.display=showPlay?'':'none';
  document.getElementById('pb-pause-icon').style.display=showPlay?'none':'';
}
function updateListenAllBtn(playing){
  document.getElementById('la-play-icon').style.display=playing?'none':'';
  document.getElementById('la-pause-icon').style.display=playing?'':'none';
  document.getElementById('la-label').textContent=playing?'Пауза':'Слушать весь маршрут';
}
function updateInlineBtns(type,idOrFile,playing){
  document.querySelectorAll('.point-play-btn').forEach(b=>{
    const same=String(b.dataset.id)===String(idOrFile);
    b.classList.toggle('playing',same&&playing);
    b.innerHTML=same&&playing?`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  });
  document.querySelectorAll('.transit-play-btn').forEach(b=>{
    const same=b.dataset.audio===idOrFile;
    b.classList.toggle('playing',same&&playing);
    b.innerHTML=same&&playing?`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  });
}

// ── AMBIENT GENERATOR ─────────────────────────────────────────────────────────
let ambientCtx=null,ambientNodes={},ambientActive=null;
function getAudioCtx(){if(!ambientCtx)ambientCtx=new(window.AudioContext||window.webkitAudioContext)();return ambientCtx;}

function toggleAmbient(btn,canvas){
  const key=btn.dataset.tr;
  if(ambientActive===key){
    stopAmbient();btn.classList.remove('playing');btn.textContent='♩ Атмосфера';ambientActive=null;return;
  }
  stopAmbient();
  ambientActive=key;
  btn.classList.add('playing');btn.textContent='◼ Стоп';
  startAmbient(key,canvas);
}

function stopAmbient(){
  if(ambientNodes.osc){try{ambientNodes.osc.forEach(o=>o.stop());}catch(e){}}
  if(ambientNodes.gain){try{ambientNodes.gain.gain.setTargetAtTime(0,getAudioCtx().currentTime,.5);}catch(e){}}
  ambientNodes={};
}

function startAmbient(key,canvas){
  const ctx=getAudioCtx();
  const master=ctx.createGain();master.gain.setValueAtTime(0,ctx.currentTime);master.gain.linearRampToValueAtTime(.18,ctx.currentTime+2);
  master.connect(ctx.destination);
  ambientNodes.gain=master;

  // Drone notes — pentatonic minor feel
  const freqs=[[55,110,165],[65,130,195],[49,98,147],[58,116,174],[52,104,156],[61,122,183],[54,108,162]][parseInt(key)||0];
  const oscs=[];
  freqs.forEach((f,i)=>{
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type=i===0?'sine':i===1?'triangle':'sine';
    o.frequency.setValueAtTime(f,ctx.currentTime);
    o.frequency.linearRampToValueAtTime(f*(1+.003*Math.sin(i)),ctx.currentTime+8);
    g.gain.setValueAtTime(i===0?.12:.05,ctx.currentTime);
    o.connect(g);g.connect(master);o.start();oscs.push(o);
  });

  // Rain noise
  const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.015;
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=800;filt.Q.value=.5;
  src.connect(filt);filt.connect(master);src.start();
  oscs.push(src);
  ambientNodes.osc=oscs;

  // Visualizer
  const analyser=ctx.createAnalyser();analyser.fftSize=64;master.connect(analyser);
  const bufLen=analyser.frequencyBinCount;const dataArr=new Uint8Array(bufLen);
  const cctx=canvas.getContext('2d');
  function draw(){
    if(ambientActive===null)return;
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArr);
    cctx.clearRect(0,0,canvas.width,canvas.height);
    const w=canvas.width/bufLen;
    for(let i=0;i<bufLen;i++){
      const h=(dataArr[i]/255)*canvas.height;
      cctx.fillStyle=`rgba(200,255,110,${dataArr[i]/512})`;
      cctx.fillRect(i*w,canvas.height-h,w-1,h);
    }
  }
  draw();
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${name}`));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
  if(name==='map'){
    setTimeout(()=>{
      initMap();
      if(leafletMap){
        leafletMap.invalidateSize();
        // re-add route if layers gone
        if(!osrmLayer&&!fallbackLayer)drawRoute();
        // restart GPS dot
        if(userMarker&&leafletMap)leafletMap.addLayer(userMarker);
      }
    },80);
  }
  setTimeout(observeFadeUps,60);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.nav)));

// ── FADE UP ───────────────────────────────────────────────────────────────────
const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:.04});
function observeFadeUps(){document.querySelectorAll('.fade-up:not(.visible)').forEach(el=>io.observe(el));}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildRoute();buildPeople();observeFadeUps();
</script>
